<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
    <link rel="stylesheet" href="style.css">
    <script src="users.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>User Directory</h1>
        </header>

        <section class="controls">
            <button id="load-users" type="button">Load Users</button>

            <div class="filter-group">
                <label for="filter-input">Filter by name:</label>
                <input type="text" id="filter-input" placeholder="Type a name...">
            </div>
        </section>

        <p id="status"></p>

        <ul id="users-list"></ul>
    </main>
</body>
</html>
